<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- PUBLIC_INTERFACE -->
    <!--
      index.html - CRA public entrypoint.
      Purpose: Provides the #root element for React to mount. Ensures dev server has a stable document during startup to avoid repeated rebuilds and inadvertent terminations observed in CI logs.
      Notes:
      - Assets are referenced from /assets/*
      - Meta viewport is set for mobile-friendly styling
    -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="description" content="Recipe Explorer Frontend" />
    <title>Recipe Explorer</title>
    <link rel="icon" href="/favicon.ico" />
    <!-- Preload optional fonts if needed in future -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
